apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yellowpad

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - api-gateway.yaml
  - document-processor.yaml
  - web-ui.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: yellowpad
